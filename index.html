<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Conveyor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, Arial; padding: 16px; }
    .bar { font-size: 24px; letter-spacing: 2px; }
    button { padding: 12px 16px; font-size: 16px; margin-top: 12px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 12px; margin-top: 12px; }
  </style>
</head>
<body>
  <h2>🎮 Конвеер</h2>

  <div class="card">
    <div id="bar" class="bar">🏁 ⬛ ⬛ 🟩 ⚡ ⚡ 🟩 🟩 🟥 ⬛ 🏁</div>
    <div id="arrow" style="margin-top:6px;">👤</div>
    <div id="amount" style="margin-top:8px;"><b>0 G</b></div>
    <div id="msg" style="margin-top:8px;"></div>
  </div>

  <button id="stepBtn">Шаг</button>
  <button id="cashBtn">Забрать</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const user = tg.initDataUnsafe?.user;
    const uid = user?.id;

    const barEl = document.getElementById("bar");
    const arrowEl = document.getElementById("arrow");
    const amountEl = document.getElementById("amount");
    const msgEl = document.getElementById("msg");

    async function api(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          ...body,
          uid,
          initData: tg.initData
        })
      });
      return await res.json();
    }

    function render(state) {
      barEl.textContent = state.track;
      arrowEl.textContent = state.pointer;
      amountEl.innerHTML = `<b>${state.amount} G</b>`;
      msgEl.textContent = state.message || "";
    }

    document.getElementById("stepBtn").onclick = async () => {
      const st = await api("/api/step", {});
      render(st);
    };

    document.getElementById("cashBtn").onclick = async () => {
      const st = await api("/api/cashout", {});
      render(st);
    };

    (async () => {
      const st = await api("/api/state", {});
      render(st);
    })();
  </script>
</body>
</html>
