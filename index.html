<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Roulette</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      text-align: center;
      margin: 0;
      padding: 40px;
    }

    .line {
      font-size: 32px;
      margin: 30px 0;
      transition: transform 0.2s;
    }

    button {
      padding: 15px 40px;
      font-size: 18px;
      background: #00ff88;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>🎰 Рулетка</h2>

<div id="roulette" class="line">
  🟥 🟩 🟦 🟨 🟥
</div>

<button onclick="spin()">Крутить</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const items = ["🟥","🟩","🟦","🟨","💀","⚡️"];

let spinning = false;

function spin() {
  if (spinning) return;
  spinning = true;

  let count = 0;
  let interval = setInterval(() => {
    let line = [];
    for (let i = 0; i < 5; i++) {
      line.push(items[Math.floor(Math.random()*items.length)]);
    }
    document.getElementById("roulette").innerText = line.join(" ");
    count++;

    if (count > 20) {
      clearInterval(interval);
      spinning = false;

      const result = line[2]; // центр
      tg.sendData(result); // отправляем боту
    }
  }, 120);
}
</script>

</body>
</html>
